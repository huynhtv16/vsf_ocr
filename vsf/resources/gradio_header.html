<style>
  .huynh-document-header {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    overflow: hidden;
    padding: 38px 24px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 18px;
    background:
      radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.28), transparent 36%),
      radial-gradient(circle at 85% 80%, rgba(99, 102, 241, 0.30), transparent 38%),
      linear-gradient(135deg, #0f172a 0%, #172554 52%, #1e3a8a 100%);
    box-shadow: 0 20px 50px rgba(15, 23, 42, 0.22);
    text-align: center;
  }

  .huynh-document-header::before {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 28px 28px;
    content: "";
    pointer-events: none;
  }

  .huynh-document-header > * {
    position: relative;
    z-index: 1;
  }

  .huynh-document-header h1 {
    margin: 0 !important;
    color: #ffffff !important;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: clamp(30px, 5vw, 52px) !important;
    font-weight: 800 !important;
    letter-spacing: -0.035em;
    line-height: 1.08;
  }

  .huynh-document-header p {
    max-width: 760px;
    margin: 0 !important;
    color: #cbd5e1 !important;
    font-size: 16px;
    line-height: 1.65;
  }

  .huynh-format-list {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 9px;
    margin-top: 2px;
  }

  .huynh-format-chip,
  .huynh-output-chip {
    display: inline-flex;
    align-items: center;
    min-height: 34px;
    padding: 0 14px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    color: #e2e8f0;
    background: rgba(15, 23, 42, 0.45);
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.025em;
    backdrop-filter: blur(8px);
  }

  .huynh-output-chip {
    border-color: rgba(125, 211, 252, 0.38);
    color: #e0f2fe;
    background: rgba(14, 116, 144, 0.30);
  }

  .huynh-format-arrow {
    padding: 0 2px;
    color: #7dd3fc;
    font-size: 18px;
    font-weight: 800;
  }

  @media (max-width: 640px) {
    .huynh-document-header {
      gap: 15px;
      padding: 30px 16px;
      border-radius: 14px;
    }

    .huynh-document-header p {
      font-size: 14px;
    }
  }
</style>

<section class="huynh-document-header{{HEADER_GRADIO_VERSION_CLASS}}">
  <h1>{{HEADER_TITLE}}</h1>
  <p>{{HEADER_SUBTITLE}}</p>

  <div class="huynh-format-list" aria-label="Định dạng tài liệu được hỗ trợ">
    <span class="huynh-format-chip">PDF</span>
    <span class="huynh-format-chip">HÌNH ẢNH</span>
    <span class="huynh-format-chip">PPTX</span>
    <span class="huynh-format-chip">XLSX</span>
    <span class="huynh-format-arrow" aria-hidden="true">→</span>
    <span class="huynh-output-chip">MARKDOWN</span>
    <span class="huynh-output-chip">JSON</span>
  </div>
</section>
