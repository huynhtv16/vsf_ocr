[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vsf"
dynamic = ["version"]
description = "VSF OCR converts PDF, images, PPTX, and XLSX into structured Markdown and JSON"
readme = "README.md"
requires-python = ">=3.10,<3.14"
keywords = [
    "vsf-ocr",
    "document-parsing",
    "document-understanding",
    "pdf",
    "markdown",
    "ocr",
    "vlm",
    "pptx",
    "xlsx",
    "multimodal",
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1.7",
    "loguru>=0.7.2",
    "numpy>=1.21.6",
    "tqdm>=4.67.1",
    "requests",
    "httpx",
    "pillow>=11.0.0",
    "pypdfium2>=4.30.0,<6.0.0",
    "pypdf>=5.6.0",
    "reportlab",
    "pdftext>=0.6.3,<0.8.0",
    "modelscope>=1.26.0",
    "huggingface-hub>=0.32.4",
    "json-repair>=0.46.2",
    "opencv-python>=4.11.0.86",
    "fast-langdetect>=0.2.3,<0.3.0",
    "openai>=1.70.0,<3",
    "beautifulsoup4>=4.13.5,<5",
    "magika>=0.6.2,<1.1.0",
    "mineru-vl-utils>=1.0.5,<2",
    'pypptx-with-oxml>=1.0.3,<2',
    "pylatexenc>=2.10,<3",
    "lxml>=4.0.0,<7.0.0",
    "openpyxl>=3.1.5,<4",
    "fastapi",
    "python-multipart",
    "uvicorn",
]

[project.optional-dependencies]
test = [
    "vsf[core]",
    "pytest",
    "pytest-cov",
    "coverage",
    "fuzzywuzzy",
    "tomli; python_version < '3.11'",
]
vlm = [
    "torch>=2.6.0,<3",
    "transformers>=4.57.3,<5.0.0",
    "accelerate>=1.5.1",
]
vllm = [
    "vllm>=0.10.1.1,<0.22.0",
]
lmdeploy = [
    "lmdeploy>=0.10.2,<0.12",
    "qwen-vl-utils>=0.0.14,<1",
]
mlx = [
    "mlx-vlm>=0.3.3,<0.4",
    "mlx<=0.31.1",
]
s3 = [
    "boto3>=1.28.43",
]
pipeline = [
    "PyYAML>=6.0.1,<7",
    "ftfy>=6.3.1,<7",
    "shapely>=2.0.7,<3",
    "pyclipper>=1.3.0,<2",
    "torch>=2.6.0,<3",
    "torchvision",
    "transformers>=4.57.3,<5.0.0",
    "safetensors>=0.4.0,<1",
    "onnxruntime>1.17.0",
]
gradio = [
    "gradio>=5.49.1,!=6.0.0,!=6.0.1,!=6.0.2,!=6.1.0,!=6.2.0,!=6.3.0,!=6.4.0,!=6.5.0,!=6.5.1,!=6.6.0,!=6.7.0,<6.9.0",
    "gradio-pdf>=0.0.22",
]
core = [
    "vsf[vlm]",
    "vsf[pipeline]",
    "vsf[gradio]",
]
all = [
    "vsf[core]",
    "vsf[s3]",
    "vsf[mlx] ; sys_platform == 'darwin'",
    "vsf[vllm] ; sys_platform == 'linux'",
    "vsf[lmdeploy] ; sys_platform == 'win32'",
]

[project.scripts]
vsf = "vsf.cli.client:main"
vsf-vllm-server = "vsf.cli.vlm_server:vllm_server"
vsf-lmdeploy-server = "vsf.cli.vlm_server:lmdeploy_server"
vsf-openai-server = "vsf.cli.vlm_server:openai_server"
vsf-models-download = "vsf.cli.models_download:download_models"
vsf-api = "vsf.cli.fast_api:main"
vsf-router = "vsf.cli.router:main"
vsf-gradio = "vsf.cli.gradio_app:main"

[tool.setuptools.dynamic]
version = { attr = "vsf.version.__version__" }

[tool.setuptools.packages.find]
include = ["vsf*"]
namespaces = false

[tool.setuptools.package-data]
"vsf" = ["resources/**"]
"vsf.model.utils.pytorchocr.utils" = ["resources/**"]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.pytest.ini_options]
addopts = "-s --cov=vsf --cov-report html"

[tool.coverage.run]
command_line = "-m pytest tests/unittest/test_e2e.py"
source = ["vsf/"]
omit = [
    "*/gradio_app.py",
    "*/models_download.py",
    "*/fast_api.py",
    "*/cli/client.py",
    "*/vlm_vllm_server.py",
    "*/cli_parser.py",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.report]
exclude_also = [
    'def __repr__',
    'if self.debug:',
    'if settings.DEBUG',
    'raise AssertionError',
    'raise NotImplementedError',
    'if 0:',
    'if __name__ == .__main__.:',
    'if TYPE_CHECKING:',
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]

[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = ["C", "E", "F", "W", "ANN"]
ignore = ["C901", "ANN204", "ANN401"]
